<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Tellus Cooperative Merch · Acceso</title>
  <link rel="stylesheet" href="../stellar/styles.css" />

  <style>
    .auth-card { width: min(430px, 100%); padding: 0; background: transparent; border: 0; box-shadow: none; }
    .auth-card h2 { font: 600 2rem/1.1 Fraunces, serif; margin: .75rem 0 .55rem; }
    .auth-card > p { color: var(--muted); line-height: 1.6; margin: 0 0 1.6rem; }
    #login-form { display: block; }
    .auth-card .field { display: grid; gap: .45rem; margin-bottom: 1rem; }
    .auth-card .field label { margin: 0; font-size: .86rem; font-weight: 600; }
    .auth-card .field input { min-height: 46px; border: 1px solid var(--line); border-radius: 11px; padding: .72rem .85rem; background: var(--surface); font: inherit; }
    .auth-card .auth-actions { display: grid; gap: .75rem; }
    .auth-card .button { margin: 0; padding: .72rem 1rem; border-radius: 10px; text-align: center; }
  </style>
</head>

  <div id="app"></div>
