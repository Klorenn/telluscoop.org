  <style>
    :root {
      --sand: #ECE0CC; --sand-soft: #F8F1E4; --teal: #3F8487; --teal-bright: #159C83; --teal-deep: #1C746B; --teal-ink: #1F3536; --clay: #C75A2A;
      --glow: #C75A2A;
      --ink: #1F3536; --ink-dim: #6B8280;
      --card: #FFFFFF; --card-border: #E9E5DD;
      --hover-bg: rgba(31,53,54,0.05); --chip-bg: rgba(31,53,54,0.07); --toggle-shadow: rgba(15,35,30,0.08);
      --card-shadow: 0 4px 20px rgba(15,35,30,0.04);
      --page-bg: #FAF8F3;
      --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', -apple-system, sans-serif;
    }
    :root[data-theme="dark"] {
      --sand: #2E3734; --sand-soft: #24302C; --teal-deep: #17615A; --teal-ink: #EDF3F1;
      --ink: #EDF3F1; --ink-dim: #93ACA6;
      --card: #182220; --card-border: rgba(255,255,255,0.08);
      --hover-bg: rgba(255,255,255,0.06); --chip-bg: rgba(255,255,255,0.1); --toggle-shadow: rgba(0,0,0,0.4);
      --card-shadow: 0 4px 20px rgba(0,0,0,0.18);
      --page-bg: #101816;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color: var(--ink); font-family: var(--sans); background: var(--page-bg); min-height: 100vh; }
    body { line-height: 1.55; min-height: 100vh; }

    main { display: block; width: 100%; max-width: none; margin: 0; padding: 0; }

    .lb-shell { display: flex; width: 100%; min-height: 100vh; background: var(--page-bg); }

    .lb-sidebar {
      width: 232px; flex-shrink: 0; background: var(--sand-soft); border-right: 1px solid var(--card-border);
      display: flex; flex-direction: column; padding: 28px 18px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .lb-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; padding: 0 4px; }
    .lb-brand img { width: 34px; height: 34px; object-fit: cover; border-radius: 50%; }
    .lb-brand span { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
    .lb-nav { display: flex; flex-direction: column; gap: 8px; }
    .lb-nav-item {
      width: 100%; height: 48px; border-radius: 12px; border: none; background: transparent;
      color: var(--ink-dim); display: flex; align-items: center; gap: 12px; padding: 0 14px;
      cursor: pointer; transition: background 160ms ease, color 160ms ease; font-family: var(--sans); font-size: 14px; font-weight: 600;
    }
    .lb-nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
    .lb-nav-item:hover { background: var(--hover-bg); color: var(--ink); }
    .lb-nav-item.is-active { background: var(--teal-bright); color: #fff; }

    .lb-sidebar-promo {
      margin-top: auto; position: relative; background: var(--sand); border-radius: 18px;
      padding: 18px 16px 60px; text-align: center; overflow: visible;
    }
    .lb-sidebar-promo p { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .lb-sidebar-promo img {
      position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
      width: 96px; height: auto; filter: drop-shadow(0 8px 14px rgba(15,35,30,0.22));
    }

    .lb-main {
      flex: 1; min-width: 0; padding: 32px 40px 40px; overflow-x: hidden;
      background: linear-gradient(180deg, #FFFFFF 0%, #F7FBFA 100%);
      display: flex; flex-direction: column; min-height: 100vh;
    }
    :root[data-theme="dark"] .lb-main { background: var(--card); }

    .lb-view-head[hidden] { display: none; }

    .lb-discord-btn {
      display: inline-flex; align-items: center; gap: 9px;
      background: #5865F2; color: #fff; border: none; border-radius: 12px;
      padding: 11px 20px; font-size: 14px; font-weight: 600; font-family: var(--sans);
      cursor: pointer; transition: background 160ms ease, transform 160ms ease; white-space: nowrap;
    }
    .lb-discord-btn:hover { background: #4752C4; transform: translateY(-1px); }
    .lb-discord-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    .lb-session-pill { display: inline-flex; align-items: center; gap: 9px; background: var(--sand-soft); padding: 8px 14px; border-radius: 999px; }
    .lb-session-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: 0 0 22px; }
    .lb-session-avatar-fallback { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; background: var(--teal); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .02em; }
    .lb-session-pill span { font-size: 12.5px; color: var(--ink); }

    .lb-discord-gate { margin-top: 12px; }
    .lb-gate-checking { font-size: 12px; color: var(--ink-dim); }
    .lb-gate-blocked { display: flex; flex-direction: column; gap: 8px; }
    .lb-gate-blocked .lb-not-verified { font-size: 12px; color: #B05A1E; line-height: 1.4; }
    .lb-gate-blocked .lb-discord-btn { width: 100%; justify-content: center; }
    .lb-gate-retry {
      background: transparent; border: 1px solid var(--card-border); color: var(--ink);
      border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 600;
      font-family: var(--sans); cursor: pointer; transition: background 160ms ease;
    }
    .lb-gate-retry:hover { background: var(--hover-bg); }
    .lb-verified-badge { display: block; font-size: 12px; font-weight: 600; color: var(--teal-bright); }

    .lb-profile-card {
      background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
      box-shadow: var(--card-shadow); padding: 26px 26px 24px;
      position: relative; z-index: 1;
    }
    .lb-profile-card h3 {
      font-family: var(--serif); font-size: 17px; color: var(--ink); margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--card-border);
    }
    .lb-profile-edit-btn {
      font-size: 12.5px; font-weight: 600; color: var(--teal-bright); background: none;
      border: 1px solid var(--card-border); border-radius: 999px; padding: 6px 14px; cursor: pointer;
    }
    .lb-profile-edit-btn:hover { background: var(--hover-bg); }
    .lb-profile-banner {
      width: 100%; height: 260px; background-size: cover; background-position: center;
      background-color: var(--chip-bg);
    }
    .lb-profile-banner-full {
      width: 100%; height: 280px; background-color: var(--chip-bg); border-radius: 18px;
      overflow: hidden; position: relative;
    }
    .lb-profile-banner-full img {
      display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;
      transform-origin: center; will-change: transform;
    }
    @media (max-width: 780px) { .lb-profile-banner { height: 160px; } .lb-profile-banner-full { height: 180px; } }
    .lb-profile-banner-adjust-btn {
      font-size: 12.5px; font-weight: 600; color: var(--teal-bright); background: none;
      border: 1px solid var(--card-border); border-radius: 999px; padding: 6px 14px; cursor: pointer;
      margin: 10px 0 12px;
    }
    .lb-profile-banner-adjust-btn:hover { background: var(--hover-bg); }
    .lb-crop-modal {
      border: none; border-radius: 20px; padding: 24px; width: min(520px, 92vw);
      background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(15,35,30,0.25);
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0;
    }
    .lb-crop-modal::backdrop { background: rgba(15,35,30,0.55); }
    .lb-crop-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .lb-crop-modal-head h2 { font-family: var(--serif); font-size: 18px; color: var(--ink); }
    .lb-crop-modal-close-btn {
      background: none; border: none; font-size: 22px; line-height: 1; color: var(--ink-dim);
      cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 140ms ease;
    }
    .lb-crop-modal-close-btn:hover { background: var(--hover-bg); }
    .lb-crop-frame {
      width: 100%; aspect-ratio: 4.2 / 1; border-radius: 12px; overflow: hidden;
      position: relative; background: var(--chip-bg); cursor: grab; touch-action: none;
      user-select: none;
    }
    .lb-crop-frame.is-dragging { cursor: grabbing; }
    .lb-crop-frame img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      pointer-events: none; will-change: transform;
    }
    .lb-crop-zoom-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
    .lb-crop-zoom-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-border); background: var(--card);
      color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 120ms ease;
    }
    .lb-crop-zoom-btn:hover:not(:disabled) { background: var(--hover-bg); }
    .lb-crop-zoom-btn:disabled { opacity: 0.35; cursor: default; }
    .lb-crop-zoom-label { font-size: 12.5px; color: var(--ink-dim); min-width: 44px; text-align: center; }
    .lb-crop-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .lb-crop-modal-cancel {
      background: none; border: 1px solid var(--card-border); color: var(--ink-dim);
      border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .lb-crop-modal-cancel:hover { background: var(--hover-bg); }
    .lb-crop-modal-apply {
      background: var(--teal-bright); border: none; color: #fff;
      border-radius: 999px; padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .lb-crop-modal-apply:hover { filter: brightness(1.05); }
    .lb-profile-avatar-wrap { margin: 0 0 16px; position: relative; z-index: 2; }
    .lb-profile-avatar-wrap .lb-session-avatar {
      width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--card); box-shadow: var(--card-shadow);
    }
    .lb-profile-avatar-wrap .lb-session-avatar-fallback { width: 96px; height: 96px; font-size: 28px; }
    .lb-profile-avatar-wrap:empty { display: none; }
    .lb-banner-carousel { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .lb-banner-carousel-track {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; flex: 1; min-width: 0;
    }
    .lb-banner-carousel-arrow {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--card-border);
      background: var(--card); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; color: var(--ink-dim); transition: background 120ms, color 120ms;
    }
    .lb-banner-carousel-arrow:hover:not(:disabled) { background: var(--hover-bg); color: var(--ink); }
    .lb-banner-carousel-arrow:disabled { opacity: 0.3; cursor: default; }
    .lb-profile-banner-option {
      height: 44px; border-radius: 8px; border: 2px solid transparent; background-size: cover;
      background-position: center; cursor: pointer; padding: 0;
    }
    .lb-profile-banner-option.is-active { border-color: var(--teal-bright); }
    @media (max-width: 520px) {
      .lb-banner-carousel-track { grid-template-columns: repeat(3, 1fr); }
    }
    .lb-profile-stats-empty {
      color: var(--ink-dim); font-size: 13.5px; display: flex; flex-direction: column;
      align-items: center; text-align: center; gap: 8px; padding: 28px 12px;
    }
    .lb-profile-summary-block { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .lb-profile-summary-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lb-profile-summary-name { font-family: var(--serif); font-size: 19px; color: var(--ink); }
    .lb-profile-summary-bio, .lb-profile-linked-hint {
      margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-dim);
    }
    .lb-profile-summary-socials { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; }
    .lb-profile-summary-socials a,
    .lb-profile-summary-socials .lb-passport-stat-social-static { display: inline-flex; align-items: center; gap: 5px; color: var(--teal-bright); text-decoration: none; }
    .lb-profile-summary-socials a:hover { text-decoration: underline; }
    .lb-profile-summary-socials svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
    .lb-profile-edit-panel { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
    .lb-profile-edit-section { display: flex; flex-direction: column; gap: 10px; }
    .lb-profile-edit-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lb-profile-edit-label { font-size: 12px; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .lb-profile-settings-actions { display: flex; flex-direction: column; gap: 10px; }
    .lb-profile-setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lb-profile-setting-info { font-size: 13px; color: var(--ink-dim); }
    .lb-profile-link-btn { width: auto; padding: 8px 16px; font-size: 12.5px; }
    .lb-profile-setting-row { flex-direction: column; align-items: stretch; }
    .lb-profile-edit-field-label { font-size: 12px; font-weight: 600; color: var(--ink-dim); margin-bottom: 4px; }
    .lb-profile-form-input {
      width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--ink); font-size: 13px;
    }
    .lb-profile-form-input:focus { outline: none; border-color: var(--accent); }
    .lb-profile-form { display: grid; gap: 12px; margin-top: 16px; }
    .lb-profile-form label { display: grid; gap: 6px; }
    .lb-profile-form span { font-size: 12px; font-weight: 600; color: var(--ink-dim); }
    .lb-profile-form input,
    .lb-profile-form textarea {
      width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--ink);
    }
    .lb-profile-form textarea { resize: vertical; min-height: 112px; }
    .lb-profile-form-message { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
    .lb-signout-btn {
      margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-dim);
      background: none; border: none; cursor: pointer; text-decoration: underline;
    }
    .lb-signout-btn:hover { color: var(--ink); }
    .lb-passport-linked-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .lb-passport-unlink-btn {
      font-size: 11.5px; font-weight: 600; color: var(--ink-dim); background: none;
      border: none; cursor: pointer; text-decoration: underline;
    }
    .lb-passport-unlink-btn:hover { color: var(--ink); }
    .lb-profile-tier-badge {
      display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }
    .lb-profile-tier-badge:empty { display: none; }
    .lb-streak-card {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--sand-soft);
    }
    .lb-streak-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lb-streak-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); font-weight: 600; }
    .lb-streak-count { font-family: var(--serif); font-size: 20px; color: var(--ink); }
    .lb-streak-sub { font-size: 12.5px; color: var(--ink-dim); }
    .lb-streak-next { font-size: 12px; color: var(--teal-bright); font-weight: 600; }
    .lb-streak-cat { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; }
    .lb-profile-tier-icon { width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; }
    .lb-profile-tier-icon-fallback {
      display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
      border-radius: 50%; background: var(--chip-bg); color: var(--ink-dim);
    }
    .lb-profile-tier-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .lb-profile-tier-text strong { font-family: var(--serif); font-size: 15px; color: var(--ink); }
    .lb-profile-tier-progress { font-size: 12px; color: var(--ink-dim); }

    .lb-profile-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
    .lb-profile-stats-row .lb-stat-card:nth-child(n+5) { justify-self: center; width: 100%; }
    @media (max-width: 640px) { .lb-profile-stats-row { grid-template-columns: repeat(2, 1fr); } .lb-profile-stats-row .lb-stat-card:nth-child(n+5) { justify-self: stretch; } }
    @media (max-width: 360px) { .lb-profile-stats-row { grid-template-columns: 1fr; } }
    .lb-profile-history-scroll { max-height: 320px; overflow-y: auto; }
    .lb-passport-stat-header-text { align-items: flex-start; }

    .lb-profile-history-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--card-border);

    .lb-profile-history-date { font-size: 12.5px; color: var(--ink-dim); }

    .lb-passport-stat-header .lb-rank-avatar-fallback { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; font-size: 16px; }
    .lb-passport-stat-name { display: block; font-family: var(--serif); font-size: 16.5px; color: var(--ink); }
    .lb-passport-stat-username { display: block; font-size: 12.5px; color: var(--ink-dim); }
    .lb-passport-stat-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
    .lb-passport-stat-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .lb-passport-stat-chip {
      display: inline-flex; align-items: center; gap: 5px; background: var(--chip-bg); color: var(--ink);
      font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; font-family: var(--sans);
    }
    .lb-passport-stat-chip strong { font-family: var(--serif); font-size: 13.5px; }
    .lb-passport-stat-link {
      font-size: 12.5px; font-weight: 600; color: var(--teal-bright); text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .lb-passport-stat-link:hover { text-decoration: underline; }
    .lb-passport-stat-role { display: block; font-size: 12px; color: var(--ink-dim); }
    .lb-passport-stat-socials { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; }
    .lb-passport-stat-socials a,
    .lb-passport-stat-socials .lb-passport-stat-social-static { display: inline-flex; align-items: center; gap: 5px; color: var(--teal-bright); text-decoration: none; }
    .lb-passport-stat-socials a:hover { text-decoration: underline; }

    .lb-settings-about { color: var(--ink-dim); font-size: 13.5px; max-width: 52ch; line-height: 1.6; }

    .lb-chess-grid { display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
    .lb-chess-card {
      background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
      padding: 20px 22px; box-shadow: var(--card-shadow);
    }
    .lb-chess-difficulty { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .lb-chess-chip {
      background: var(--sand-soft); border: 1px solid var(--card-border); color: var(--ink-dim);
      border-radius: 999px; padding: 8px 14px; font-family: var(--sans); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 140ms ease, color 140ms ease;
    }
    .lb-chess-chip:hover { color: var(--ink); }
    .lb-chess-chip.is-active { background: var(--teal-bright); border-color: transparent; color: #fff; }
    .lb-chess-challenge { display: flex; gap: 8px; flex-wrap: wrap; }
    .lb-chess-input {
      flex: 1; min-width: 200px; background: var(--sand-soft); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 9px 14px; font-family: var(--sans); font-size: 13.5px; color: var(--ink);
    }
    .lb-chess-input:focus { outline: none; border-color: var(--glow); }
    .lb-chess-btn {
      background: var(--sand-soft); border: 1px solid var(--card-border); color: var(--ink);
      border-radius: 999px; padding: 9px 18px; font-family: var(--sans); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 140ms ease;
    }
    .lb-chess-btn:hover { background: var(--sand); }
    .lb-chess-btn-primary { background: var(--teal-bright); border-color: transparent; color: #fff; }
    .lb-chess-btn-primary:hover { background: var(--teal-bright); filter: brightness(1.05); }
    .lb-chess-btn-danger { background: var(--clay); border-color: transparent; color: #fff; }
    .lb-chess-btn-danger:hover { background: var(--clay); filter: brightness(1.05); }
    .lb-chess-btn-small { padding: 6px 12px; font-size: 12px; }
    .lb-chess-mygames-title { font-family: var(--serif); font-size: 16px; color: var(--ink); margin-bottom: 10px; }
    .lb-chess-mygames { display: flex; flex-direction: column; }
    .lb-chess-game-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .lb-chess-game-row:last-child { border-bottom: none; }
    .lb-chess-game-info { flex: 1; min-width: 0; font-size: 13.5px; color: var(--ink); }
    .lb-chess-tag {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-dim);
      background: var(--chip-bg); padding: 3px 9px; border-radius: 999px; font-weight: 600;
    }
    .lb-chess-empty, .lb-chess-status, .lb-chess-error, .lb-chess-finished { font-size: 13.5px; color: var(--ink-dim); }
    .lb-chess-error { color: #B05A1E; }
    .lb-chess-layout { display: flex; flex-direction: column; gap: 18px; }
    .lb-chess-board-wrap { display: flex; justify-content: center; }
    #lb-chess-board { width: 100%; max-width: 520px; aspect-ratio: 1 / 1; margin: 0 auto; }
    @media (min-width: 1200px) {
      .lb-chess-layout { flex-direction: row; align-items: flex-start; justify-content: center; gap: 28px; }
      .lb-chess-board-wrap { flex: 0 0 clamp(420px, 42vw, 560px); }
      .lb-chess-panel { flex: 0 0 260px; display: flex; flex-direction: column; gap: 14px; }
    }
    .lb-chess-lobby-head { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .lb-chess-tutorial {
      border: none; border-radius: 18px; background: var(--card); color: var(--ink);
      padding: 22px 24px; max-width: 560px; width: min(90vw, 560px); box-shadow: var(--card-shadow);
    }
    .lb-chess-tutorial::backdrop { background: rgba(15,35,30,0.45); }
    .lb-chess-tutorial-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .lb-chess-tutorial-head h2 { font-family: var(--serif); font-size: 22px; color: var(--ink); margin: 0; }
    .lb-chess-tutorial-title-wrap { display: flex; align-items: center; gap: 12px; }
    .lb-chess-tutorial-cat { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; }
    .lb-chess-modal-close {
      background: transparent; border: none; color: var(--ink-dim); font-size: 22px; cursor: pointer;
      line-height: 1; padding: 4px 8px; border-radius: 8px;
    }
    .lb-chess-modal-close:hover { background: var(--hover-bg); }
    .lb-chess-tutorial-body { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .lb-chess-tutorial-section h3 { font-family: var(--serif); font-size: 15px; color: var(--ink); margin: 0 0 4px; }
    .lb-chess-tutorial-section p { font-size: 13.5px; color: var(--ink-dim); line-height: 1.55; margin: 0; }
    .lb-chess-coach {
      display: flex; align-items: center; gap: 12px;
      background: var(--chip-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 14px;
      transition: border-color 200ms ease, background 200ms ease;
    }
    .lb-chess-coach.is-my-turn { border-color: var(--teal-bright); background: rgba(21,156,131,0.08); }
    .lb-chess-coach-cat {
      width: 48px; height: 48px; object-fit: contain; flex-shrink: 0;
      animation: lbCoachIdle 2.6s ease-in-out infinite;
      transform-origin: 50% 90%;
    }
    .lb-chess-coach.is-my-turn .lb-chess-coach-cat { animation: lbCoachBounce 0.9s ease-in-out infinite; }
    .lb-chess-coach-cat.pop { animation: lbCoachPop 0.5s ease; }
    @keyframes lbCoachIdle {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes lbCoachBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-6px) scale(1.06); }
    }
    @keyframes lbCoachPop {
      0% { transform: scale(0.85) rotate(-4deg); }
      55% { transform: scale(1.14) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .lb-chess-coach-body { min-width: 0; }
    .lb-chess-coach strong {
      display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--ink-dim); margin-bottom: 4px;
    }
    .lb-chess-coach p { margin: 0; font-size: 13.5px; color: var(--ink); line-height: 1.5; }

    @media (max-width: 960px) {
      .lb-content-grid { flex-direction: column; }
      .lb-col-side { width: 100%; }
      .lb-stats { grid-template-columns: repeat(2, 1fr); }
      .lb-secondary-grid { flex-direction: column; }
    }
    @media (max-width: 720px) {
      .lb-shell { flex-direction: column; }
      .lb-sidebar { width: 100%; padding: 16px; position: static; height: auto; overflow-y: visible; }
      .lb-sidebar-promo { display: none; }
      .lb-nav { flex-direction: row; overflow-x: auto; }
      .lb-nav-item { width: auto; white-space: nowrap; }
      .lb-main { padding: 28px 20px 32px; }
      .lb-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="lb-shell">
      <aside class="lb-sidebar">
        <div class="lb-brand">
          <img src="/tierly/tierly-logo.png" alt="Tierly" />
          <span>Tierly</span>
        </div>
        <nav class="lb-nav" id="lb-nav"></nav>
        <div class="lb-sidebar-promo">
          <p id="lb-sidebar-promo-text"></p>
          <img src="/tierly/tierly-apoyado.png" alt="Tierly" />
        </div>
      </aside>
      <div class="lb-main">

        <section id="lb-ranking-view" class="lb-view" data-view="ranking">
          <div class="lb-stats" id="lb-stats"></div>
          <div class="lb-content-grid">
            <div class="lb-col-main">
              <div class="lb-leaderboard-card">
                <div class="lb-view-head">
                  <div>
                    <h2 id="lb-ranking-title"></h2>
                    <span id="lb-season-note" class="lb-season-note"></span>
                  </div>
                  <div class="lb-rank-controls">
                    <button id="lb-ranks-info-btn" type="button" class="lb-ranks-info-btn">
                      <i data-lucide="info"></i><span id="lb-ranks-info-btn-label"></span>
                    </button>
                    <div id="lb-rank-tabs" class="lb-rank-tabs"></div>
                    <input type="search" id="lb-player-search" class="lb-search-input" />
                  </div>
                </div>
                <div id="lb-ranking" aria-label="ranking" style="flex:1; display:flex; flex-direction:column;"></div>
                <div id="lb-passport-results" class="lb-passport-results" hidden></div>
                <button id="lb-view-full" type="button"></button>
              </div>
            </div>
            <aside class="lb-col-side" id="lb-side"></aside>
          </div>
          <div class="lb-secondary-grid">
            <div class="lb-secondary-card">
              <h2 id="lb-upcoming-title"></h2>
              <div id="lb-upcoming"></div>
            </div>
            <div class="lb-secondary-card">
              <h2 id="lb-activity-title"></h2>
              <div id="lb-activity"></div>
            </div>
          </div>
        </section>

        <section class="lb-view" data-view="bracket" hidden>
          <h2 id="lb-bracket-title" class="lb-view-head"></h2>
          <div id="lb-bracket"></div>
        </section>

        <section class="lb-view" data-view="rewards" hidden>
          <h2 id="lb-rewards-title" class="lb-view-head"></h2>
          <div id="lb-rewards"></div>
        </section>

        <section class="lb-view" data-view="profile" hidden>
          <h2 id="lb-profile-title" class="lb-view-head" hidden></h2>
          <div id="lb-profile-banner" class="lb-profile-banner-full"><img id="lb-profile-banner-img" alt="" /></div>
          <div class="lb-profile-card">
            <div id="lb-profile-avatar" class="lb-profile-avatar-wrap"></div>
            <div id="lb-auth"></div>
            <div id="lb-profile-summary"></div>
            <div id="lb-profile-tier" class="lb-profile-tier-badge"></div>
            <div id="lb-profile-streak"></div>
            <div id="lb-profile-stats" class="lb-profile-stats-row"></div>
            <h3 id="lb-profile-history-title"></h3>
            <div id="lb-profile-history" class="lb-profile-history-scroll"></div>
          </div>
        </section>

        <section class="lb-view" data-view="settings" hidden>
          <h2 id="lb-settings-title" class="lb-view-head"></h2>
          <div id="lb-settings"></div>
        </section>

        <section class="lb-view" data-view="player" hidden>
          <button type="button" id="lb-player-back-btn" class="lb-mini-btn lb-profile-link-btn" style="margin-bottom:16px;"><span id="lb-player-back-label"></span></button>
          <div id="lb-player-banner" class="lb-profile-banner-full" hidden><img id="lb-player-banner-img" alt="" /></div>
          <div class="lb-profile-card">
            <div id="lb-player-avatar" class="lb-profile-avatar-wrap"></div>
            <div id="lb-player-summary"></div>
            <div id="lb-player-tier" class="lb-profile-tier-badge"></div>
            <div id="lb-player-stats" class="lb-profile-stats-row"></div>
          </div>
        </section>

        <section class="lb-view" data-view="chess" hidden>
          <h2 id="lb-chess-title" class="lb-view-head"></h2>
          <div id="lb-chess"></div>
        </section>

        <footer class="lb-footer">
          <div class="lb-footer-brand">
            <img src="/tierly/tierly-logo.png" alt="Tierly" class="lb-footer-tierly-mark" />
            <span>×</span>
            <img src="/hub/logos/tellus-logo-full.svg" alt="Tellus Cooperative" />
          </div>
          <nav class="lb-footer-nav">
            <a href="https://telluscoop.org" target="_blank" rel="noopener noreferrer">Tellus Cooperative</a>
            <a href="https://telluscoop.org/resources" target="_blank" rel="noopener noreferrer">Recursos</a>
            <a href="https://telluscoop.org/hub" target="_blank" rel="noopener noreferrer">Hub</a>
          </nav>
          <div class="lb-footer-links" id="lb-footer-links"></div>
          <div class="lb-footer-divider"></div>
          <span class="lb-footer-copy">© 2026 Tellus Cooperative · Tierly</span>
        </footer>
      </div>
    </div>
    <dialog id="lb-ranks-modal" class="lb-ranks-modal">
      <div class="lb-ranks-modal-head">
        <h2 id="lb-ranks-modal-title"></h2>
        <button id="lb-ranks-modal-close" type="button" class="lb-ranks-modal-close-btn" aria-label="close">&times;</button>
      </div>
      <p id="lb-ranks-modal-intro" class="lb-ranks-modal-intro"></p>
      <p id="lb-ranks-modal-points" class="lb-ranks-modal-intro"></p>
      <div id="lb-ranks-modal-list" class="lb-ranks-modal-list"></div>
    </dialog>
    <dialog id="lb-crop-modal" class="lb-crop-modal">
      <div class="lb-crop-modal-head">
        <h2 id="lb-crop-modal-title"></h2>
        <button id="lb-crop-modal-close" type="button" class="lb-crop-modal-close-btn" aria-label="close">&times;</button>
      </div>
      <div id="lb-crop-frame" class="lb-crop-frame">
        <img id="lb-crop-frame-img" alt="" draggable="false" />
      </div>
      <div class="lb-crop-zoom-row">
        <button type="button" id="lb-crop-zoom-out" class="lb-crop-zoom-btn" aria-label="Zoom out">&minus;</button>
        <span id="lb-crop-zoom-label" class="lb-crop-zoom-label">100%</span>
        <button type="button" id="lb-crop-zoom-in" class="lb-crop-zoom-btn" aria-label="Zoom in">&plus;</button>
      </div>
      <div class="lb-crop-modal-actions">
        <button type="button" id="lb-crop-modal-cancel" class="lb-crop-modal-cancel"></button>
        <button type="button" id="lb-crop-modal-apply" class="lb-crop-modal-apply"></button>
      </div>
    </dialog>

    <dialog id="lb-chess-tutorial" class="lb-chess-tutorial">
      <div class="lb-chess-tutorial-head">
        <div class="lb-chess-tutorial-title-wrap">
          <img src="/tierly/streak/negro.png" alt="" class="lb-chess-tutorial-cat" id="lb-chess-tutorial-cat" />
          <h2 id="lb-chess-tutorial-title"></h2>
        </div>
        <button id="lb-chess-tutorial-close" type="button" class="lb-chess-modal-close" aria-label="close">&times;</button>
      </div>
      <div id="lb-chess-tutorial-body" class="lb-chess-tutorial-body"></div>
      <button id="lb-chess-tutorial-gotit" type="button" class="lb-chess-btn lb-chess-btn-primary"></button>
    </dialog>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script type="module" src="/tierly/chess.js?v=20260829-08"></script>
  <script type="module" src="/tierly/app.js?v=20260829-08"></script>
</body>
</html>
