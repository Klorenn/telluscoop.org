<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tellus Resources · Resource</title>

  <!-- SEO: this template is client-rendered (one file serves every /resources/tools/:slug via
       vercel.json rewrite), so per-tool title/description are set client-side in render()
       below for the browser tab + share preview once JS runs; these tags stay as the static
       fallback non-JS crawlers see. og:url intentionally points at /resources (not a real per-slug
       canonical) since the actual slug can't be known statically without a build step. -->
  <meta name="description" content="Resource profile from the Tellus Resources catalog: free plan, use cases, and alternatives." />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://telluscoop.org/resources" />
  <meta property="og:site_name" content="Tellus Cooperative" />
  <meta property="og:title" content="Tellus Resources · Resource" />
  <meta property="og:description" content="Resource profile from the Tellus Resources catalog: free plan, use cases, and alternatives." />
  <meta property="og:image" content="https://telluscoop.org/uploads/ChatGPT%20Image%20Jul%2029%2C%202026%2C%2012_10_56%20PM.png" />
  <meta property="og:image:width" content="1774" />
  <meta property="og:image:height" content="887" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="es_LA" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@TellusCoop" />
  <meta name="twitter:creator" content="@TellusCoop" />
  <meta name="twitter:title" content="Tellus Resources · Resource" />
  <meta name="twitter:description" content="Resource profile from the Tellus Resources catalog: free plan, use cases, and alternatives." />
  <meta name="twitter:image" content="https://telluscoop.org/uploads/ChatGPT%20Image%20Jul%2029%2C%202026%2C%2012_10_56%20PM.png" />

  <link rel="icon" type="image/png" href="/uploads/TellusCooperative%20ICON.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --sand: #ECE0CC;
      --sand-soft: #F5EDDD;
      --sand-muted: #D4C8B5;
      --teal: #3F8487;
      --teal-deep: #2A5A5C;
      --teal-ink: #1F3536;
      --clay: #C75A2A;
      --clay-deep: #9E441F;
      --cream-90: rgba(236,224,204,0.90);
      --cream-70: rgba(236,224,204,0.70);
      --serif: 'Fraunces', 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--sand); color: var(--teal-ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body { line-height: 1.55; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; }
    a { color: inherit; }

    .eyebrow {
      font-family: var(--sans); font-size: 11px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal-deep); opacity: 0.75;
    }

    /* Nav (same as resources/index.html) */
    .dv-nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(236,224,204,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--sand-muted);
    }
    .dv-nav-inner {
      max-width: 1320px; margin: 0 auto; padding: 14px 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
    }
    .dv-nav-home { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .dv-nav-home img { height: 34px; width: auto; }
    .dv-nav-home span { font-family: var(--serif); font-size: 16px; letter-spacing: -0.02em; color: var(--teal-deep); }
    .dv-nav-right { display: flex; align-items: center; gap: 16px; }
    .dv-nav-meta { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--teal-deep); opacity: 0.75; }
    .dv-nav-meta a { text-decoration: none; color: var(--teal); }
    .dv-nav-meta a:hover { color: var(--clay); }

    .dv-lang-switcher { position: relative; }
    .dv-lang-trigger {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--sand-muted);
      background: var(--sand-soft); font-family: var(--mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.06em; color: var(--teal-deep); transition: border-color 180ms ease;
    }
    .dv-lang-trigger:hover { border-color: var(--teal); }
    .dv-lang-trigger svg { width: 13px; height: 13px; }
    .dv-lang-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 60;
      background: var(--sand-soft); border: 1px solid var(--sand-muted); border-radius: 10px;
      padding: 4px; display: flex; flex-direction: column; gap: 2px; min-width: 130px;
      box-shadow: 0 12px 28px -12px rgba(31,53,54,0.3);
    }
    .dv-lang-option {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px;
      font-size: 13px; color: var(--teal-ink); text-align: left; background: none; border: none; width: 100%;
    }
    .dv-lang-option:hover { background: color-mix(in srgb, var(--teal-ink) 6%, transparent); }
    .dv-lang-option.is-on { background: color-mix(in srgb, var(--teal) 12%, transparent); }
    .dv-lang-code { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--teal); letter-spacing: 0.06em; min-width: 22px; }

    /* Breadcrumb */
    .td-breadcrumb {
      max-width: 1180px; margin: 0 auto; padding: 22px 48px 0;
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em; color: var(--teal-deep);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; opacity: 0.85;
    }
    .td-breadcrumb a { text-decoration: none; color: var(--teal); }
    .td-breadcrumb a:hover { color: var(--clay); }
    .td-breadcrumb strong { color: var(--teal-ink); font-weight: 600; }
    .td-breadcrumb .sep { opacity: 0.5; }

    /* Hero: profile + live preview */
    .td-hero {
      max-width: 1180px; margin: 0 auto; padding: 28px 48px 40px;
      display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 40px; align-items: start;
    }
    .td-profile-eyebrow { margin-bottom: 18px; }
    .td-name-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .td-favicon {
      width: 66px; height: 66px; border-radius: 16px; flex-shrink: 0;
      background: var(--sand-soft); display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--sand-muted);
    }
    .td-favicon img { width: 36px; height: 36px; object-fit: contain; }
    .td-h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 4vw, 42px); letter-spacing: -0.02em; line-height: 1.05; }
    .td-category-label {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; color: var(--teal-deep);
      opacity: 0.7; margin-bottom: 18px; text-transform: uppercase;
    }
    .td-desc { font-size: 16.5px; color: var(--teal-ink); opacity: 0.82; line-height: 1.6; margin-bottom: 26px; max-width: 46ch; }
    .td-cta-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .td-cta-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 22px; border-radius: 999px; background: var(--clay); color: var(--sand);
      font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
      text-decoration: none; transition: background 180ms ease, transform 180ms ease;
    }
    .td-cta-primary:hover { background: var(--clay-deep); transform: translateY(-1px); }
    .td-cta-secondary {
      font-family: var(--mono); font-size: 13px; letter-spacing: 0.03em; color: var(--teal);
      text-decoration: none;
    }
    .td-cta-secondary:hover { color: var(--clay); }

    /* Live preview */
    .td-preview-head { margin-bottom: 14px; }
    .td-preview-head h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: -0.01em; margin-top: 6px; }
    .td-browser-frame {
      border-radius: 14px; overflow: hidden; border: 1px solid var(--sand-muted);
      background: var(--sand-soft); box-shadow: 0 20px 44px -24px rgba(31,53,54,0.35);
    }
    .td-browser-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 38px;
      background: var(--cream-90); border-bottom: 1px solid var(--sand-muted);
    }
    .td-browser-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sand-muted); }
    .td-browser-dot:nth-child(1) { background: #E0A9A0; }
    .td-browser-dot:nth-child(2) { background: #E3C98F; }
    .td-browser-dot:nth-child(3) { background: #9FC1A6; }
    .td-browser-url {
      margin-left: 8px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--mono); font-size: 11.5px; color: var(--teal-deep); opacity: 0.75;
      background: var(--sand); border: 1px solid var(--sand-muted); border-radius: 999px; padding: 4px 12px;
    }
    .td-preview-wrap { position: relative; aspect-ratio: 4 / 2.5; background: var(--sand); overflow: hidden; }
    .td-preview-img { width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity 320ms ease; }
    .td-preview-img.is-loaded { opacity: 1; }
    .td-preview-loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; padding: 20px;
    }
    .td-preview-loading strong { font-family: var(--serif); font-size: 16px; color: var(--teal-deep); }
    .td-preview-loading span { font-family: var(--mono); font-size: 11.5px; color: var(--teal-deep); opacity: 0.65; }
    .td-preview-loading.is-hidden { display: none; }
    .td-preview-caption {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; font-family: var(--mono); font-size: 11.5px; color: var(--teal-deep); opacity: 0.75;
    }
    .td-preview-caption a { text-decoration: none; color: var(--teal); }
    .td-preview-caption a:hover { color: var(--clay); }

    /* Body: article + aside */
    .td-body {
      max-width: 1180px; margin: 0 auto; padding: 8px 48px 56px;
      display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 44px; align-items: start;
      border-top: 1px solid var(--sand-muted);
    }
    .td-article { display: flex; flex-direction: column; gap: 48px; padding-top: 44px; min-width: 0; }
    .td-section .eyebrow { display: block; margin-bottom: 16px; }
    .td-section h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -0.015em; margin: 0 0 16px; }
    .td-section p { font-size: 15px; line-height: 1.65; color: var(--teal-ink); opacity: 0.82; margin-bottom: 12px; }
    .td-section p:last-child { margin-bottom: 0; }
    .td-quote {
      border-left: 3px solid var(--clay); padding: 4px 0 4px 16px; font-style: italic;
      opacity: 0.9 !important;
    }
    .td-numbered-list { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
    .td-numbered-item { display: flex; gap: 14px; align-items: flex-start; }
    .td-numbered-item .num {
      font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: var(--clay-deep);
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      background: var(--cream-90); border: 1px solid var(--sand-muted);
    }
    .td-numbered-item p { margin: 0; font-size: 15px; line-height: 1.6; opacity: 0.85; padding-top: 2px; }

    /* Try-this-first: a connected step flow (tutorial feel), distinct from the
       scannable index chips above, solid circles linked by a rail so it reads
       as "do this, then this" rather than a flat list of options. */
    .td-steps { display: flex; flex-direction: column; margin-top: 6px; }
    .td-step { display: flex; gap: 16px; }
    .td-step-rail { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .td-step-num {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: var(--teal); color: var(--sand-soft);
      font-family: var(--mono); font-size: 12.5px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px var(--sand);
    }
    .td-step-connector { width: 2px; flex: 1; min-height: 16px; background: var(--sand-muted); margin: 3px 0; }
    .td-step-body { padding: 2px 0 26px; min-width: 0; }
    .td-step:last-child .td-step-body { padding-bottom: 0; }
    .td-step-body p { margin: 0; font-size: 15px; line-height: 1.6; opacity: 0.85; }
    .td-caveats { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .td-caveat { display: flex; gap: 10px; align-items: baseline; }
    .td-caveat .mark { color: var(--clay); flex-shrink: 0; }
    .td-caveat p { margin: 0; }

    .td-aside {
      position: sticky; top: 90px; background: var(--sand-soft); border: 1px solid var(--sand-muted);
      border-radius: 16px; padding: 22px; margin-top: 40px;
    }
    .td-aside .eyebrow { display: block; margin-bottom: 14px; }
    .td-aside-badge {
      display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
      background: var(--teal-ink); color: var(--sand); margin-bottom: 14px;
    }
    .td-aside-badge.limited { background: var(--clay); }
    .td-aside-cost-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--teal-deep); opacity: 0.7; margin-bottom: 6px; }
    .td-aside-cost-detail { font-size: 13.5px; line-height: 1.55; color: var(--teal-ink); opacity: 0.85; margin-bottom: 18px; }
    .td-aside-dl { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .td-aside-dl div { display: flex; flex-direction: column; gap: 2px; }
    .td-aside-dl dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--teal-deep); opacity: 0.65; }
    .td-aside-dl dd { font-size: 13.5px; color: var(--teal-ink); }
    .td-aside-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .td-aside-tags span {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.03em; padding: 3px 9px;
      border-radius: 999px; background: var(--cream-90); color: var(--teal-deep); border: 1px solid var(--sand-muted);
    }
    .td-aside-link {
      display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12.5px;
      font-weight: 600; color: var(--teal); text-decoration: none;
    }
    .td-aside-link:hover { color: var(--clay); }

    /* Keep exploring */
    .td-alternatives { max-width: 1180px; margin: 0 auto; padding: 0 48px 64px; }
    .td-alt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .td-alt-head h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 2.4vw, 30px); letter-spacing: -0.015em; margin-top: 6px; }
    .td-alt-head-link { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--teal); text-decoration: none; }
    .td-alt-head-link:hover { color: var(--clay); }
    .td-alt-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .td-alt-card {
      background: var(--sand-soft); border: 1px solid var(--sand-muted); border-radius: 14px; padding: 18px;
      display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
      transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
      opacity: 0; transform: translateY(10px);
      animation: td-alt-in 480ms ease forwards;
      animation-delay: var(--td-alt-delay, 0ms);
    }
    .td-alt-card:hover {
      border-color: var(--teal-deep);
      box-shadow: 0 14px 32px -18px rgba(31,53,54,0.28);
      transform: translateY(-3px);
    }
    .td-alt-topline { display: flex; align-items: center; gap: 10px; }
    .td-alt-favicon {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      background: var(--sand); display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--sand-muted);
    }
    .td-alt-favicon img { width: 16px; height: 16px; object-fit: contain; }
    .td-alt-card h3 { font-family: var(--serif); font-size: 16px; letter-spacing: -0.01em; min-width: 0; }
    .td-alt-card p { font-size: 12.5px; opacity: 0.75; line-height: 1.5; }
    .td-alt-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .td-alt-tags span {
      font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 999px;
      background: var(--cream-90); color: var(--teal-deep); border: 1px solid var(--sand-muted);
    }
    .td-alt-card-link { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--teal); margin-top: auto; }

    @keyframes td-alt-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .td-alt-card {
        opacity: 1; transform: none; animation: none; transition: border-color 200ms ease, box-shadow 200ms ease;
      }
      .td-alt-card:hover { transform: none; }
    }

    /* Footer: ported from foundation.jsx's <footer className="fs-footer"> / foundation.css .fs-footer* */
    .dv-footer {
      border-top: 1px solid var(--sand-muted);
      background: var(--sand-soft);
      padding: 64px 48px 32px;
    }
    .dv-footer-grid {
      max-width: 1320px; margin: 0 auto 48px;
      display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 64px;
    }
    .dv-footer-mark { display: inline-block; text-decoration: none; line-height: 0; }
    .dv-footer-mark-img { display: block; height: 44px; width: auto; transition: opacity 200ms ease; }
    .dv-footer-mark:hover .dv-footer-mark-img { opacity: 0.82; }
    .dv-footer-brand p {
      margin: 16px 0; font-size: 14px; line-height: 1.55; color: var(--teal-ink); opacity: 0.7; max-width: 320px;
    }
    .dv-footer-grid ul { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 10px; }
    .dv-footer-grid ul a {
      font-size: 14px; color: var(--teal-ink); opacity: 0.75; text-decoration: none;
      transition: opacity 200ms ease, color 200ms ease;
    }
    .dv-footer-grid ul a:hover { opacity: 1; color: var(--teal-deep); }
    .dv-footer-icon-link { display: inline-flex; align-items: center; gap: 7px; }
    .dv-footer-base {
      max-width: 1320px; margin: 0 auto; padding-top: 24px; border-top: 1px solid var(--sand-muted);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      font-family: var(--mono); font-size: 11px; color: var(--teal-deep); letter-spacing: 0.05em;
    }
    .dv-footer-brandguide {
      font-size: 11px; opacity: 0.55; font-family: var(--mono); letter-spacing: 0.05em;
      text-decoration: none; color: var(--teal-deep);
    }
    .dv-footer-backlink {
      display: inline-block; margin-top: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em;
      color: var(--teal); text-decoration: none; transition: color 180ms ease;
    }
    .dv-footer-backlink:hover { color: var(--clay); }
    @media (max-width: 960px) {
      .dv-footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
      .dv-footer-brand { grid-column: span 2; }
      .dv-footer-base { flex-direction: column; gap: 8px; text-align: center; }
    }
    @media (max-width: 640px) {
      .dv-footer-grid { grid-template-columns: 1fr; gap: 32px; }
      .dv-footer-brand { grid-column: span 1; }
    }

    .td-notfound { max-width: 720px; margin: 0 auto; padding: 96px 48px; text-align: center; }
    .td-notfound h1 { font-family: var(--serif); font-size: 32px; margin-bottom: 14px; }
    .td-notfound p { opacity: 0.75; margin-bottom: 20px; }
    .td-notfound a { font-family: var(--mono); font-size: 13px; color: var(--teal); text-decoration: none; }
    .td-notfound a:hover { color: var(--clay); }

    @media (max-width: 1020px) {
      .td-hero { grid-template-columns: minmax(0, 1fr); gap: 32px; }
      .td-body { grid-template-columns: minmax(0, 1fr); }
      .td-aside { position: static; }
      .td-alt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .dv-nav-inner { padding: 12px 22px; }
      .dv-nav-meta { display: none; }
      .td-breadcrumb { padding: 18px 22px 0; }
      .td-hero { padding: 22px 22px 32px; }
      .td-body { padding: 8px 22px 40px; }
      .td-alternatives { padding: 0 22px 48px; }
      .dv-footer { padding: 32px 22px; }
      .td-alt-grid { grid-template-columns: minmax(0, 1fr); }
    }

  function updateMetaTags(title, description) {

      '<a href="/resources">' + escapeHtml(t("breadcrumbHome")) + '</a>' +
      '<span class="sep">/</span>' +
      '<a href="/resources?category=' + encodeURIComponent(tool.category) + '">' + escapeHtml(categoryLabel(category)) + '</a>' +
      '<span class="sep">/</span>' +
      '<strong>' + escapeHtml(name) + '</strong>';

    var heroHtml =
      '<div class="td-profile">' +
        '<div class="eyebrow td-profile-eyebrow">' + escapeHtml(t("profileEyebrow")) + '</div>' +
        '<div class="td-name-row">' +
          '<span class="td-favicon"><img src="' + faviconUrl(tool.url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'" /></span>' +
          '<h1 class="td-h1">' + escapeHtml(name) + '</h1>' +
        '</div>' +
        '<div class="td-category-label">' + escapeHtml(categoryLabel(category)) + '</div>' +
        '<p class="td-desc">' + escapeHtml(desc) + '</p>' +
        '<div class="td-cta-row">' +
          '<a class="td-cta-primary" href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener">' + escapeHtml(t("visitPrefix") + " " + name) + ' ↗</a>' +
          '<a class="td-cta-secondary" href="/resources">' + escapeHtml(t("backToDirectory")) + '</a>' +
        '</div>' +
      '</div>' +
      '<div class="td-preview">' +
        '<div class="td-preview-head">' +
          '<div class="eyebrow">' + escapeHtml(t("liveEyebrow")) + '</div>' +
          '<h2>' + escapeHtml(t("liveHeading")) + '</h2>' +
        '</div>' +
        '<figure class="td-browser-frame">' +
          '<div class="td-browser-bar">' +
            '<span class="td-browser-dot"></span><span class="td-browser-dot"></span><span class="td-browser-dot"></span>' +
            '<span class="td-browser-url">' + escapeHtml(host) + '</span>' +
          '</div>' +
          '<div class="td-preview-wrap">' +
            '<div class="td-preview-loading" id="td-preview-loading">' +
              '<strong>' + escapeHtml(name) + '</strong>' +
              '<span>' + escapeHtml(t("previewLoadingLabel")) + '</span>' +
            '</div>' +
            '<img class="td-preview-img" id="td-preview-img" alt="Screenshot of the ' + escapeHtml(name) + ' website" />' +
          '</div>' +
        '</figure>' +
        '<div class="td-preview-caption">' +
          '<span>' + escapeHtml(t("previewCaption")) + '</span>' +
          '<a href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener">' + escapeHtml(host) + ' ↗</a>' +
        '</div>' +
      '</div>';

    var useCasesHtml = useCases.map(function (uc, i) {
      var n = String(i + 1).padStart(2, "0");
      return '<div class="td-numbered-item"><span class="num">' + n + '</span><p>' + escapeHtml(uc) + '</p></div>';
    }).join("");

    var tryStepsHtml = trySteps.map(function (step, i) {
      var isLast = i === trySteps.length - 1;
      return (
        '<div class="td-step">' +
          '<div class="td-step-rail">' +
            '<span class="td-step-num">' + (i + 1) + '</span>' +
            (isLast ? '' : '<span class="td-step-connector"></span>') +
          '</div>' +
          '<div class="td-step-body"><p>' + escapeHtml(step) + '</p></div>' +
        '</div>'
      );
    }).join("");

    var caveat1 = tool.no_card ? t("caveatNoCard") : t("caveatCard");

    var articleHtml =
      '<article class="td-article">' +
        '<div class="td-section">' +
          '<div class="eyebrow">' + escapeHtml(t("shortVersionEyebrow")) + '</div>' +
          '<h2>' + escapeHtml(t("whatIsPrefix") + " " + name + "?") + '</h2>' +
          '<p>' + escapeHtml(desc) + '</p>' +
          '<p>' + escapeHtml(t("usefulFor")(name, tagsStr)) + ' ' + escapeHtml(shortExtra) + '</p>' +
          '<p class="td-quote">' + escapeHtml(t("freeFlowQuote")(freeDetail)) + '</p>' +
        '</div>' +
        '<div class="td-section">' +
          '<div class="eyebrow">' + escapeHtml(t("useCasesEyebrow")) + '</div>' +
          '<h2>' + escapeHtml(t("useCasesHeading")) + '</h2>' +
          '<div class="td-numbered-list">' + useCasesHtml + '</div>' +
        '</div>' +
        '<div class="td-section">' +
          '<div class="eyebrow">' + escapeHtml(t("tryEyebrow")) + '</div>' +
          '<h2>' + escapeHtml(tryTitle) + '</h2>' +
          '<div class="td-steps">' + tryStepsHtml + '</div>' +
        '</div>' +
        '<div class="td-section">' +
          '<div class="eyebrow">' + escapeHtml(t("caveatsEyebrow")) + '</div>' +
          '<h2>' + escapeHtml(t("caveatsHeading")) + '</h2>' +
          '<div class="td-caveats">' +
            '<div class="td-caveat"><span class="mark">·</span><p>' + escapeHtml(caveat1) + '</p></div>' +
            '<div class="td-caveat"><span class="mark">·</span><p>' + escapeHtml(caveat2) + '</p></div>' +
          '</div>' +
        '</div>' +
      '</article>';

    var badgeClass = tool.no_card ? "" : "limited";
    var badgeText = tool.no_card ? t("noCardBadge") : t("cardBadge");
    var tagsHtml = tagsList.map(function (tag) { return '<span>' + escapeHtml(tag) + '</span>'; }).join("");

    var asideHtml =
      '<aside class="td-aside">' +
        '<span class="eyebrow">' + escapeHtml(t("asideEyebrow")) + '</span>' +
        '<span class="td-aside-badge ' + badgeClass + '">' + escapeHtml(badgeText) + '</span>' +
        '<div class="td-aside-cost-label">' + escapeHtml(t("includedFree")) + '</div>' +
        '<p class="td-aside-cost-detail">' + escapeHtml(freeDetail) + '</p>' +
        '<div class="td-aside-dl">' +
          '<div><dt>' + escapeHtml(t("idealForLabel")) + '</dt><dd>' + escapeHtml(idealFor) + '</dd></div>' +
          '<div><dt>' + escapeHtml(t("categoryLabel")) + '</dt><dd>' + escapeHtml(categoryLabel(category)) + '</dd></div>' +
          '<div><dt>' + escapeHtml(t("lastReviewedLabel")) + '</dt><dd>' + escapeHtml(lastReviewed) + '</dd></div>' +
        '</div>' +
        '<div class="td-aside-tags">' + tagsHtml + '</div>' +
        '<a class="td-aside-link" href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener">' + escapeHtml(t("checkPricing")) + '</a>' +
      '</aside>';

    var alternatives = alternativesFor(tool);
    var altCardsHtml = alternatives.map(function (alt, i) {
      var altTags = (alt.tags || []).map(function (tag) { return '<span>' + escapeHtml(tag) + '</span>'; }).join("");
      return (
        '<a class="td-alt-card" style="--td-alt-delay:' + (i * 60) + 'ms" href="/resources/tools/' + encodeURIComponent(alt.slug) + '">' +
          '<div class="td-alt-topline">' +
            '<span class="td-alt-favicon"><img src="' + faviconUrl(alt.url) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'" /></span>' +
            '<h3>' + escapeHtml(alt.name) + '</h3>' +
          '</div>' +
          '<p>' + escapeHtml(toolDesc(alt)) + '</p>' +
          '<div class="td-alt-tags">' + altTags + '</div>' +
          '<span class="td-alt-card-link">' + escapeHtml(t("readAbout")(alt.name)) + '</span>' +
        '</a>'
      );
    }).join("");

    var alternativesHtml = alternatives.length ? (
      '<section class="td-alternatives">' +
        '<div class="td-alt-head">' +
          '<div>' +
            '<div class="eyebrow">' + escapeHtml(t("keepExploringEyebrow")) + '</div>' +
            '<h2>' + escapeHtml(t("alternativesTo")(name)) + '</h2>' +
          '</div>' +
          '<a class="td-alt-head-link" href="/resources?category=' + encodeURIComponent(tool.category) + '">' + escapeHtml(t("seeCategory")) + '</a>' +
        '</div>' +
        '<div class="td-alt-grid">' + altCardsHtml + '</div>' +
      '</section>'
    ) : "";

    document.getElementById("td-root").innerHTML =
      '<div class="td-breadcrumb">' + breadcrumbHtml + '</div>' +
      '<div class="td-hero">' + heroHtml + '</div>' +
      '<div class="td-body">' + articleHtml + asideHtml + '</div>' +
      alternativesHtml;

    renderFooterStatic();

    setupPreviewImage(tool.url);
  }

  function setupPreviewImage(url) {
    var img = document.getElementById("td-preview-img");
    var loading = document.getElementById("td-preview-loading");
    if (!img) return;
    var retried = false;

    function onLoaded() {
      img.classList.add("is-loaded");
      if (loading) loading.classList.add("is-hidden");
      // mshots often serves a generic placeholder on the very first request;
      // silently refresh once so the real screenshot can replace it.
      if (!retried) {
        retried = true;
        setTimeout(function () {
          var refreshed = new Image();
          refreshed.onload = function () { img.src = refreshed.src; };
          refreshed.src = mshotsUrl(url, Date.now());
        }, 2500);
      }
    }

    img.addEventListener("load", onLoaded);
    img.addEventListener("error", function () {
      if (loading) {
        loading.classList.remove("is-hidden");
      }
    });
    img.src = mshotsUrl(url);
  }

  function slugFromPath() {
    // Rewrites (vercel.json / serve.json) are transparent: the browser's
    // visible URL stays "/resources/tools/<slug>" with no query string ever
    // reaching this page, so the slug must come from the pathname.
    var match = location.pathname.match(/\/resources\/tools\/([^/]+)\/?$/);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function resolveTool() {
    var slug = slugFromPath() || new URLSearchParams(location.search).get("slug");
    if (!slug || !state.data) { state.tool = null; return; }
    state.tool = state.data.tools.find(function (tl) { return tl.slug === slug; }) || null;
  }

  state.lang = loadLang();

  fetch("/resources/tools.json")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      state.data = data;
      resolveTool();
      render();
    })
    .catch(function (err) {
      document.getElementById("td-root").innerHTML =
        '<div class="td-notfound"><h1>Error</h1><p>Could not load the catalog. Please reload.</p></div>';
      console.error("Failed to load tools.json", err);
    });

  var langTrigger = document.getElementById("dv-lang-trigger");
  var langDropdown = document.getElementById("dv-lang-dropdown");
  langTrigger.addEventListener("click", function (e) {
    e.stopPropagation();
    langDropdown.style.display = langDropdown.style.display === "none" ? "flex" : "none";
  });
  document.addEventListener("click", function (e) {
    if (!document.getElementById("dv-lang-switcher").contains(e.target)) {
      langDropdown.style.display = "none";
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".dv-lang-option"), function (btn) {
    btn.addEventListener("click", function () {
      state.lang = btn.getAttribute("data-lang");
      saveLang(state.lang);
      langDropdown.style.display = "none";
      render();
    });
  });
})();
</script>

</body>
</html>
